name: Validate dashboard data

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate immutable snapshot data
        run: node scripts/validate-data.mjs

      - name: Validate Dashboard research contract
        run: node scripts/validate-dashboard-contract.mjs
