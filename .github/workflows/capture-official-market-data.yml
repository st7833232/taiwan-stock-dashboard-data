name: Capture official market data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-official-market-data.yml'
      - '.github/market-data-trigger'
      - 'strategy-config.json'
      - 'scripts/check-daily-publication.mjs'
      - 'scripts/backfill-v2-market-history.mjs'
      - 'scripts/summarize-official-market-data.mjs'
      - 'scripts/fetch-official-market-data.mjs'
  workflow_dispatch:
    inputs:
      target_date:
        description: Optional target date (YYYY-MM-DD, Asia/Taipei)
        required: false
        type: string
      backfill_history:
        description: Backfill official V2 price history
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '15 10-14 * * 1-5'

permissions:
  contents: write

concurrency:
  group: official-market-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve target date and backfill mode
        shell: bash
        env:
          INPUT_TARGET_DATE: ${{ inputs.target_date }}
          INPUT_BACKFILL_HISTORY: ${{ inputs.backfill_history }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          target=""

          if [[ -n "${INPUT_TARGET_DATE:-}" ]]; then
            target="$INPUT_TARGET_DATE"
          fi

          if [[ -z "$target" ]]; then
            target="$(TZ=Asia/Taipei date +%F)"
            echo "No explicit target date; resolved current Asia/Taipei date: $target"
          else
            echo "Resolved target date: $target"
          fi

          echo "TARGET_DATE=$target" >> "$GITHUB_ENV"

          if [[ "${INPUT_BACKFILL_HISTORY:-false}" == "true" ]]; then
            echo "BACKFILL_V2_HISTORY=1" >> "$GITHUB_ENV"
            echo "V2 history backfill enabled by workflow input."
          fi

      - name: Capture official sources
        run: node scripts/fetch-official-market-data.mjs

      - name: Build dynamic full-market research input
        run: node scripts/summarize-official-market-data.mjs

      - name: Backfill or extend official V2 market history
        run: node scripts/backfill-v2-market-history.mjs

      - name: Rebuild research input with technical history
        run: node scripts/summarize-official-market-data.mjs

      - name: Check publication recovery state
        run: node scripts/check-daily-publication.mjs

      - name: Commit raw evidence, rolling history and recovery state when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- raw/ history/ && [ -z "$(git status --porcelain --untracked-files=all raw/ history/)" ]; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw/ history/
          git commit -m "data: capture official market evidence"
          git pull --rebase origin main
          git push origin HEAD:main
