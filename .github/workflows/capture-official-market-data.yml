name: Capture official market data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-official-market-data.yml'
      - '.github/market-data-trigger'
      - 'strategy-config.json'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      target_date:
        description: Optional target date (YYYY-MM-DD, Asia/Taipei)
        required: false
        type: string
      backfill_history:
        description: Backfill official V2 price history
        required: false
        default: false
        type: boolean
      financial_continuation:
        description: Legacy internal continuation count
        required: false
        default: '0'
        type: string
      recovery_count:
        description: Internal bounded self-healing continuation count
        required: false
        default: '0'
        type: string
  schedule:
    - cron: '0,30 10-15 * * 1-5'
    - cron: '20 23 * * 0-4'
    - cron: '20 0 * * 1-5'

permissions:
  contents: write
  actions: write

concurrency:
  group: official-market-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache official PDF text reader packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-pdf-reader-${{ runner.os }}-v1
      - name: Install official PDF text reader
        run: |
          command -v pdftotext >/dev/null && command -v tesseract >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-chi-tra
          }
      - name: Test recovery and screening rules
        run: node --test scripts/*.test.mjs
      - name: Autonomous capture, evidence, screening and atomic publication
        id: capture
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_DATE: ${{ inputs.target_date }}
          BACKFILL_V2_HISTORY: ${{ inputs.backfill_history && '1' || '' }}
        run: node scripts/run-daily-pipeline.mjs
      - name: Self-heal incomplete or recoverable pipeline
        if: always() && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECOVERY_COUNT: ${{ inputs.recovery_count || inputs.financial_continuation || '0' }}
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
        run: node scripts/continue-pipeline-recovery.mjs
      - name: Save resumable checkpoint and failure details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-checkpoint-${{ github.run_id }}
          path: |
            raw/*/pipeline-status.json
            raw/*/evidence-pending.json
            raw/*/financial-evidence-captures.json
            raw/*/financial-pdf-collection.json
            history/financial-pdf-collection.json
            history/reviewed-financial-reports.json
            history/financial-reports/
            raw/*/daily-report.json
            raw/*/publication-state.json
            raw/*/gate-matrix.json
            snapshots/
            manifest.json
          retention-days: 7
